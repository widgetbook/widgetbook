publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: ^3.47.0

dependencies:
  flutter:
    sdk: flutter
  widgetbook: ^4.0.0-beta.12

dev_dependencies:
  build_runner: ^2.10.1
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
